<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>404 - 页面不存在 ｜ Xiaowei Luo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #05070d; color: #e8f1f8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
        'Microsoft YaHei', 'Noto Sans SC', sans-serif;
      text-align: center; padding: 24px;
      background-image:
        radial-gradient(500px 300px at 20% 10%, rgba(0, 209, 255, 0.10), transparent 60%),
        radial-gradient(600px 400px at 80% 30%, rgba(124, 92, 255, 0.10), transparent 60%);
    }
    .code {
      font-size: clamp(80px, 20vw, 160px); font-weight: 800; line-height: 1;
      background: linear-gradient(90deg, #00d1ff, #7c5cff);
      -webkit-background-clip: text; background-clip: text;
      -webkit-text-fill-color: transparent; color: transparent;
      filter: drop-shadow(0 0 24px rgba(0, 209, 255, 0.35));
    }
    .title { font-size: clamp(20px, 4vw, 30px); font-weight: 600; margin: 18px 0 10px; }
    .desc { color: #8ba3b8; font-size: 15px; margin-bottom: 32px; }
    .btn {
      display: inline-block; text-decoration: none; font-weight: 600;
      padding: 13px 34px; border-radius: 12px;
      background: linear-gradient(90deg, #00d1ff, #7c5cff); color: #fff;
      box-shadow: 0 6px 20px rgba(0, 209, 255, 0.35);
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(0, 209, 255, 0.5); }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <div class="title">页面不存在</div>
    <div class="desc">您访问的页面可能已被移动或删除</div>
    <a class="btn" href="./">返回首页</a>
  </div>
</body>
</html>
